version: 2

models:
  - name: stg_incident_events
    description: One row per incident event with real types and '?' turned into NULL.
    columns:
      - name: event_id
        description: Row number in the source file.
        tests: [unique, not_null]
      - name: incident_number
        tests: [not_null]
      - name: opened_at
        tests: [not_null]
      - name: sys_updated_at
        tests: [not_null]
      - name: incident_state
        tests:
          - accepted_values:
              arguments:
                values: ['New', 'Active', 'Resolved', 'Closed', 'Awaiting User Info',
                         'Awaiting Vendor', 'Awaiting Problem', 'Awaiting Evidence', 'Unknown']
      - name: priority_code
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: int_incident_events_ordered
    description: Events in order per incident, with the next state and next update time.
    columns:
      - name: event_seq
        tests: [not_null]
